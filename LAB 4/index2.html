<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Construct</title>
    <link rel="stylesheet" href="style2.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="container">
                <h1>Food Construct</h1>
                <nav class="main-menu">
                    <ul>
                        <li><a href="index.html#about">О нас</a></li>
                        <li><a href="#makelunch" class="active">Собрать ланч</a></li>
                        <li><a href="#order">Заказы</a></li>
                        <li><a href="#contacts">Контакты</a></li>
                    </ul>
                </nav>
            </div>
        </header>
        <main>
            <div class="container">
                <section id="soups">
                    <h2>Выберите суп</h2>
                    <div class="menu-section"></div>
                </section>
                <section id="main-dishes">
                    <h2>Выберите главное блюдо</h2>
                    <div class="menu-section"></div>
                </section>
                <section id="drinks">
                    <h2>Выберите напиток</h2>
                    <div class="menu-section"></div>
                </section>
            </div>
        </main>
        <section id="order-form">
            <div class="container">
                <form action="https://httpbin.org/post" method="POST">
                    <div class="order-block">
                        <h3>Ваш заказ</h3>
                    </div>
                    <div class="client-block">
                        <h3>Ваши данные</h3>
                        <label for="name">Имя:</label>
                        <input type="text" id="name" name="name" required>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                        <div class="form-group">
                            <input type="checkbox" id="subscribe" name="subscribe" checked>
                            <label for="subscribe">Получать информацию о скидках и акциях</label>
                        </div>
                        <label for="phone">Телефон:</label>
                        <input type="tel" id="phone" name="phone" required>
                        <label for="address">Адрес:</label>
                        <input type="text" id="address" name="address" required>
                        <fieldset>
                            <legend>Выбор времени доставки:</legend>
                            <div class="form-group">
                                <input type="radio" id="asap" name="delivery-time" value="asap" required>
                                <label for="asap">Как можно скорее</label>
                            </div>
                            <div class="form-group">
                                <input type="radio" id="scheduled" name="delivery-time" value="scheduled" required>
                                <label for="scheduled">К указанному времени</label>
                            </div>
                        </fieldset>
                        <label for="delivery-time-input">Укажите время доставки:</label>
                        <input type="time" id="delivery-time-input" name="delivery-time-input" min="07:00" max="23:00" step="300" required>
                        <button type="reset">Сбросить</button>
                        <button type="submit">Отправить</button>
                    </div>
                </form>
            </div>
        </section>
        <footer id="contacts">
            <div class="container">
                <p>&copy; Позвонить нам <a href="tel:+70000000000">+7-000-000-000-00</a></p>
            </div>
        </footer>
    </div>
    <script src="dishes.js"></script>
    <script src="displayDishes.js"></script>
    <script src="orderForm.js"></script>
</body>
</html>
